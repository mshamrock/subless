<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Subless">
  <!--
    The S is two arcs rather than a typeface: a subscription is a loop, and this
    one is cut open. Flat (butt) ends keep the cut visible at large sizes.

    The arcs are elliptical on purpose. Two circles can only meet where the
    junction sits on both, which forces a tall, narrow S with too much air around
    it — at 16px that reads as a small mark in a big square. Widening the radii
    fills the tile and holds up in a tab strip.

    Lime tile rather than dark: tab strips are usually light, and a dark square
    disappears into them.
  -->
  <rect width="32" height="32" rx="7" fill="#c9f24d"/>
  <path d="M 23.4 10.8 A 7.4 5.2 0 1 0 16 16 A 7.4 5.2 0 1 1 8.6 21.2" fill="none" stroke="#0a0b0d" stroke-width="4.6" stroke-linecap="butt"/>
</svg>
